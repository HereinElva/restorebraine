<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="https://media.base44.com/images/public/68fdc5f42768c4d045fe1bac/e76571efc_appstore.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="restorebraine-deploy" content="v94" />
    <title>Restorebraine</title>
    <script src="./native-oauth-return.js"></script>
    <script src="./login-redirect.js"></script>
    <script>
      window.__rbBooted = false;
      window.addEventListener('error', function (e) {
        if (window.__rbBooted) return;
        var msg = (e && e.message) || 'Script failed to load';
        var root = document.getElementById('root');
        if (!root) return;
        root.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;font-family:system-ui,sans-serif;background:#fff"><div style="max-width:420px;text-align:center"><h1 style="font-size:18px;color:#111;margin-bottom:8px">Restorebraine failed to load</h1><p style="font-size:13px;color:#666;margin-bottom:12px">' + msg + '</p><button type="button" onclick="location.reload()" style="padding:10px 18px;border:none;border-radius:10px;background:#7c3aed;color:#fff;font-weight:600">Retry</button></div></div>';
      });
    </script>
  </head>
  <body>
    <svg aria-hidden="true" focusable="false" style="position:absolute;width:0;height:0;overflow:hidden">
      <defs>
        <linearGradient id="rb-brand-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stopColor="#60a5fa" />
          <stop offset="100%" stopColor="#a855f7" />
        </linearGradient>
      </defs>
    </svg>
    <div id="root">
      <div id="rb-boot-fallback" style="min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:system-ui,sans-serif;color:#666;background:#fff">
        Loading Restorebraine…
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
