<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/AppIcon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Restorebraine</title>
    <script>
      (function () {
        try {
          if (!window.__restorebraineOAuthFixInstalled) {
            window.__restorebraineOAuthFixInstalled = true;
            var originalOpen = window.open;
            window.open = function (url, target, features) {
              if (typeof url === 'string' && url.length > 0) {
                window.location.assign(url);
                return window;
              }
              return originalOpen ? originalOpen.call(window, url, target, features) : null;
            };
          }

          var cap = window.Capacitor;
          var native = cap && cap.isNativePlatform && cap.isNativePlatform();
          if (native && window.location.hostname !== 'restorebraine.base44.app') {
            window.location.replace('https://restorebraine.base44.app');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
