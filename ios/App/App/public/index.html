    <script>
      (function () {
        try {
          if (!window.__restorebraineOAuthFixInstalled) {

            var originalOpen = window.open;
            window.open = function (url, target, features) {
              if (typeof url === 'string' && url.length > 0) {
                window.location.assign(url);

          if (native && window.location.hostname === 'app.base44.com') {
            var path = window.location.pathname || '';
            if (path.indexOf('/login') !== 0 && path.indexOf('/api/apps/auth') !== 0 && !params.get('access_token')) {
              window.location.replace(APP_LOGIN_URL);

          }
